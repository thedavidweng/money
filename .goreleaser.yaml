version: 2

builds:
  - main: ./cmd/money
    binary: money
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/money/internal/cli.Version={{.Version}}
      - -X github.com/thedavidweng/money/internal/cli.Commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

universal_binaries:
  - name_template: "money_{{ .Version }}_darwin_all"

archives:
  - formats: [tar.gz]
    name_template: "money_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - package_name: money
    vendor: thedavidweng
    maintainer: thedavidweng <noreply@github.com>
    homepage: https://github.com/thedavidweng/money
    description: "Local-first personal finance backend for agents and power users"
    license: Apache-2.0
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: cosign
    output: true
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - cmd: syft
    artifacts: archive
    args:
      - "${artifact}"
      - --output
      - spdx-json=${document}
    documents:
      - "${artifact}.spdx.json"

changelog:
  disable: true

release:
  mode: append
  github:
    owner: thedavidweng
    name: money
  header: |
    ## Installation

    **Homebrew Cask (macOS/Linux):**
    ```
    brew install --cask thedavidweng/tap/money
    ```

    **Go:**
    ```
    go install github.com/thedavidweng/money/cmd/money@{{ .Tag }}
    ```

    **Pre-built binaries:** Download below and verify with `checksums.txt`.

    ## Verify signatures

    This release is signed with [Sigstore](https://sigstore.dev) keyless signing.
    To verify the checksums file:
    ```
    cosign verify-blob \
      --bundle checksums.txt.sig \
      --certificate-identity-regexp="https://github.com/thedavidweng/money" \
      --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
      checksums.txt
    ```

homebrew_casks:
  - name: money
    binaries:
      - money
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thedavidweng/money"
    license: "Apache-2.0"
    description: "Local-first personal finance backend for agents and power users"
    # GoReleaser's `hooks` still emit Homebrew's deprecated `preflight`/
    # `postflight` stanzas (upstream goreleaser/goreleaser#6873). Emitting the
    # modern `postflight_steps` DSL via `custom_block` avoids the deprecation
    # warning. GoReleaser renders `custom_block` at the top of the cask; the
    # tap's `normalize_cask_style.py` then moves it into its canonical stanza
    # position. Placement is cosmetic only: `ArtifactSet` sorts artifacts by
    # class, so `postflight_steps` runs after `generate_completions_from_executable`
    # regardless of where it sits in the file.
    # The `{{ ... }}` escaping keeps the literal `{{staged_path}}` Homebrew
    # template token from being evaluated by GoReleaser.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/money"]
        end
      end

