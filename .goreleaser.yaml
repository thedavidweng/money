version: 2

builds:
  - main: ./cmd/money
    binary: money
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/money/internal/cli.Version={{.Version}}
      - -X github.com/thedavidweng/money/internal/cli.Commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "money_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: thedavidweng
    name: money

brews:
  - name: money
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/thedavidweng/money"
    description: "A local-first, self-hostable personal finance backend for AI agents and power users."
    license: MIT
    install: |
      bin.install "money"
