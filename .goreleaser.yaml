version: 2

builds:
  - main: ./cmd/money
    binary: money
    ldflags:
      - -s -w
      - -X github.com/thedavidweng/money/internal/cli.Version={{.Version}}
      - -X github.com/thedavidweng/money/internal/cli.Commit={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

universal_binaries:
  - name_template: "money_{{ .Version }}_darwin_all"

archives:
  - formats: [tar.gz]
    name_template: "money_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: cosign
    output: true
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - cmd: syft
    artifacts: archive
    args:
      - "${artifact}"
      - --output
      - spdx-json=${document}
    documents:
      - "${artifact}.spdx.json"

changelog:
  disable: true

release:
  mode: append
  github:
    owner: thedavidweng
    name: money

homebrew_casks:
  - name: money
    binaries:
      - money
    repository:
      owner: thedavidweng
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/thedavidweng/money"
    license: "Apache-2.0"
    description: "Local-first personal finance backend for agents and power users"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/money"]
          end